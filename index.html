<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميمو - المساعد الذكي</title>
    <!-- استدعاء Tailwind للألوان -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: white; }
        .msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 16px; margin-bottom: 10px; line-height: 1.6; }
        .user-msg { background-color: #7c3aed; color: white; align-self: flex-start; border-top-right-radius: 0; }
        .ai-msg { background-color: #1e293b; color: #e2e8f0; align-self: flex-end; border-top-left-radius: 0; border: 1px solid #334155; }
        /* إخفاء شريط التمرير */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <!-- حاوية الشات -->
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[85vh]">
        
        <!-- الهيدر -->
        <div class="bg-purple-700 p-4 flex items-center gap-3 shadow-lg">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-2xl">🤖</div>
            <div>
                <h1 class="font-bold text-lg">المساعد الذكي ميمو</h1>
                <p class="text-xs text-purple-200 flex items-center gap-1">
                    <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> متصل الآن
                </p>
            </div>
        </div>

        <!-- منطقة الرسائل -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-2">
            <!-- رسالة ترحيب -->
            <div class="msg-bubble ai-msg">
                أهلاً يا بطل! 👋 أنا ميمو.. جاهز نذاكر إيه النهاردة؟
            </div>
        </div>

        <!-- منطقة الكتابة -->
        <div class="p-4 bg-slate-800 border-t border-slate-700">
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." 
                    class="flex-1 bg-slate-900 text-white px-4 py-3 rounded-xl border border-slate-600 focus:border-purple-500 focus:outline-none transition-colors" autocomplete="off">
                <button type="submit" id="send-btn" 
                    class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl font-bold transition-transform active:scale-95">
                    إرسال 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- السحر (Javascript) -->
    <script>
        // ⚠️ استبدل الكلمة دي بمفتاحك الحقيقي عشان يشتغل
        // لو سبتها فاضية هتشتغل ديمو
        const API_KEY = AIzaSyBpvU_qU7ocojaPCh3hPY4mLmgnHNezTOs
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `msg-bubble ${isUser ? 'user-msg' : 'ai-msg'}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // عرض رسالة المستخدم
            addMessage(text, true);
            input.value = '';
            
            // تأثير التحميل
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg-bubble ai-msg text-gray-400 text-sm';
            loadingDiv.textContent = 'ميمو بيكتب... ✍️';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // لو مفيش مفتاح، رد برد وهمي (للاختبار)
                if (API_KEY.includes("حط_مفتاح")) {
                    throw new Error("المفتاح مش موجود");
                }

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `رد عليا باللهجة المصرية كأنك مدرس خصوصي شاطر: ${text}` }] }]
                        })
                    }
                );

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;

                chatBox.removeChild(loadingDiv);
                addMessage(reply, false);

            } catch (error) {
                chatBox.removeChild(loadingDiv);
                // رد احتياطي لو المفتاح مش شغال
                addMessage("معلش يا بطل، مش قادر أتصل بالمخ دلوقتي. (تأكد من وضع المفتاح في الكود)", false);
            }
        });
    </script>
</body>
</html>
